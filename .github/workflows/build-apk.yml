
name: BRAIN ARENA APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p app
          unzip -q brain-arena-v1.5.zip -d app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor
        run: |
          cd app
          ROOT=$(find . -name index.html -printf '%h\n' | head -1)

          if [ -z "$ROOT" ]; then
            echo "index.html not found"
            exit 1
          fi

          mkdir -p www
          cp -r "$ROOT"/. www/

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init "BRAIN ARENA" "com.zunexstudios.brainarena" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin duplicate dependencies
        run: |
          cd app/android
          cat >> gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat >> app/build.gradle <<'EOF'

          configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BRAIN-ARENA-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
